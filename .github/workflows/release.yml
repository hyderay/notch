name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app bundle
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}" make app
      - name: Package app
        run: |
          ARCHIVE="Notch-${GITHUB_REF_NAME}-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent .build/Notch.app "$ARCHIVE"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ensure_release() {
            for attempt in {1..6}; do
              gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && return 0
              gh release create "$GITHUB_REF_NAME" \
                --generate-notes \
                --title "Notch ${GITHUB_REF_NAME}" && return 0
              sleep $((attempt * 5))
            done
            return 1
          }

          upload_assets() {
            for attempt in {1..6}; do
              gh release upload "$GITHUB_REF_NAME" \
                "Notch-${GITHUB_REF_NAME}-macOS.zip" \
                "Notch-${GITHUB_REF_NAME}-macOS.zip.sha256" \
                --clobber && return 0
              sleep $((attempt * 5))
            done
            return 1
          }

          ensure_release
          upload_assets
