name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app bundle
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}" make app
      - name: Package app
        run: |
          ARCHIVE="Notch-${GITHUB_REF_NAME}-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent .build/Notch.app "$ARCHIVE"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "Notch-${GITHUB_REF_NAME}-macOS.zip" \
            "Notch-${GITHUB_REF_NAME}-macOS.zip.sha256" \
            --generate-notes \
            --title "Notch ${GITHUB_REF_NAME}"
